[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stalzone-api"
version = "0.1.0"
description = "Async Python client for the Stalzone API (Stalcraft)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]
keywords = ["stalzone", "stalcraft", "api", "async", "exbo"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stalzone_api"]
