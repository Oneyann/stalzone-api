[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "stalzone-api"
version = "0.1.0"
description = "Python client for the Stalzone API (Stalcraft) and the official items database"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "stalzone-api contributors" }]
keywords = ["stalzone", "stalcraft", "api", "oauth", "game", "exbo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/Oneyann/stalzone-api"
Repository = "https://github.com/Oneyann/stalzone-api"
Issues = "https://github.com/Oneyann/stalzone-api/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
gui = ["PySide6>=6.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/stalzone_api"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: live requests to the Stalzone API (enabled with STALZONE_RUN_INTEGRATION=1)",
]
